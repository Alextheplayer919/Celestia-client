name: Build

# Only runs when something that can actually affect the build changes.
#
# Docs and repository housekeeping do not compile into the APK, so a docs-only
# push or pull request no longer starts a job: edit a README, update docs/, or
# push a commit that carries no code change, and nothing runs. Any change to
# source, tests, build files, the wrapper or this workflow still triggers a build.
#
# Note for later: if branch protection is ever enabled here, requiring this
# workflow would block a docs-only pull request forever ("Waiting for status to
# be reported"), because a skipped workflow reports no status at all. The fix at
# that point is to drop the path filters and instead gate the expensive steps
# behind a cheap change-detection job, so the check always reports.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'resourcepack/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'resourcepack/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch: {}

# A newer push to the same branch makes the older run pointless: cancel it.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the committed wrapper (Gradle 8.7), which is what the AGP version
      # requires. setup-gradle only adds caching on top.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: celestia-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
